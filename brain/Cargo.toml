[package]
name = "pvta-brain"
version = "0.2.0"
edition = "2021"

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1
